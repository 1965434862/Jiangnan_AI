<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小南</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e8f4f8 0%, #f0f8fb 50%, #e8f4f8 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px; /* 加宽容器 */
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(66, 153, 225, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(66, 153, 225, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4299e1, #38b2ac, #4299e1);
            border-radius: 20px 20px 0 0;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(66, 153, 225, 0.1);
        }
        .header h1 {
            color: #2d3748;
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(66, 153, 225, 0.1);
            background: linear-gradient(120deg, #4299e1, #38b2ac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #4a5568;
            margin-top: 12px;
            font-size: 16px;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        /* 视频面板 + 聊天面板 + 音乐面板 */
        .main-layout {
            display: flex;
            gap: 20px;
            width: 100%;
        }
        /* 虚拟角色视频面板 */
        .avatar-panel {
            flex: 0 0 400px; /* 固定宽度，大尺寸显示 */
            background: rgba(247, 250, 252, 0.8);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(66, 153, 225, 0.1);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 700px;
            position: relative;
            overflow: hidden;
        }
        .avatar-video-container {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        .avatar-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 400px;
        }
        /* flex布局，歌词占满剩余空间 */
        .music-panel {
            flex: 1;
            background: rgba(247, 250, 252, 0.8);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(66, 153, 225, 0.1);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
            /* 关键修改：改为垂直布局，标签栏在上，内容在下 */
            display: flex;
            flex-direction: column;
            /* 移除居中，避免内容被挤到中间 */
            align-items: stretch;
            justify-content: flex-start;
            min-height: 700px;
            height: 100%;
            /* 保留相对定位，防止内容溢出 */
            position: relative;
            /* 内容超出时滚动 */
            overflow-y: auto;
        }
        /* 播放面板占位符 */
        .music-placeholder {
            color: #718096;
            text-align: center;
            font-size: 18px;
            line-height: 2;
            opacity: 0.7;
        }
        /* 歌曲播放容器改为flex布局，占满整个面板 */
        .music-player-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
        }
        /* 音频播放器样式 */
        .audio-player {
            width: 100%;
            height: 50px;
            border-radius: 8px;
            border: 1px solid rgba(66, 153, 225, 0.2);
            flex-shrink: 0; /* 防止被压缩 */
        }
        /* 歌词展示样式 - 只显示三行 */
        .lyric-container {
            width: 100%;
            flex: 1;
            overflow: hidden;
            position: relative;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(66, 153, 225, 0.1);
            padding: 0;
            min-height: 320px; 
            height: 320px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lyric-scroll {
            position: relative;
            width: 100%;
            transform: translateY(0);
        }
        /* 三行显示专用 */
        .lyric-line {
            height: 90px;
            line-height: 90px; 
            text-align: center;
            font-size: 20px;
            color: #6e7c7c;
            transition: all 0.2s ease;
            padding: 0 20px;
            opacity: 0;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
        }

        .lyric-line.prev {
            opacity: 0.5;
            transform: translateY(-90px); 
        }
        .lyric-line.active {
            opacity: 1;
            color: #4299e1;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(66, 153, 225, 0.2);
            height: 90px; 
            line-height: 90px; 
            transform: translateY(0);
        }
        .lyric-line.next {
            opacity: 0.5;
            transform: translateY(90px);
        }
        .song-title {
            color: #2d3748;
            font-size: 28px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
            flex-shrink: 0;
            padding: 10px 0;
            border-bottom: 2px solid rgba(66, 153, 225, 0.1);
            width: 100%;
        }
        .chat-box {
            height: 520px;
            overflow-y: auto;
            background: rgba(247, 250, 252, 0.8);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 15px;
            border: 1px solid rgba(66, 153, 225, 0.1);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #4299e1, #38b2ac);
            border-radius: 8px;
            border: 2px solid rgba(247, 250, 252, 0.5);
        }
        .chat-box::-webkit-scrollbar-track {
            background: rgba(247, 250, 252, 0.5);
            border-radius: 8px;
        }
        .message {
            margin-bottom: 22px;
            max-width: 72%;
            clear: both;
        }
        .user-message {
            float: right;
        }
        .ai-message {
            float: left;
        }
        .message-content {
            padding: 18px 24px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.1);
            line-height: 1.7;
            font-size: 15px;
        }
        .user-message .message-content {
            background: linear-gradient(135deg, #4299e1, #38b2ac);
            color: #ffffff;
            border: 1px solid rgba(66, 153, 225, 0.2);
            border-bottom-right-radius: 6px;
        }
        .ai-message .message-content {
            background: rgba(255, 255, 255, 0.9);
            color: #2d3748;
            border: 1px solid rgba(66, 153, 225, 0.1);
            border-bottom-left-radius: 6px;
        }
        .message-time {
            font-size: 12px;
            color: #718096;
            margin-top: 8px;
            text-align: right;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }
        /* 输入区域布局 */
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .voice-btn-container {
            display: flex;
            justify-content: center;
        }
        .input-area {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #user-input {
            flex: 1;
            height: 70px;
            padding: 20px 24px;
            border-radius: 16px;
            border: 1px solid rgba(66, 153, 225, 0.2);
            background: rgba(255, 255, 255, 0.9);
            color: #2d3748;
            font-size: 16px;
            outline: none;
            resize: none;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        #user-input:focus {
            border-color: #4299e1;
            box-shadow: 0 0 15px rgba(66, 153, 225, 0.1),
                        inset 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        #user-input::placeholder {
            color: #a0aec0;
            opacity: 0.7;
        }
        /* 大尺寸语音按钮 */
        .voice-btn {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* 磨砂+浅色渐变 */
            background: linear-gradient(135deg, #f5fafe, #eaf6fa);
            box-shadow: 
                0 8px 20px rgba(66, 153, 225, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(66, 153, 225, 0.1);
            color: #4299e1;
            position: relative;
            z-index: 10;
        }
        .voice-btn::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #718096;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        /* 录音状态样式 */
        .voice-btn.recording {
            background: linear-gradient(135deg, #fef7fb, #fcf1f7);
            color: #e53e3e;
            transform: scale(1.05);
            box-shadow: 
                0 10px 25px rgba(229, 62, 62, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(229, 62, 62, 0.1);
            animation: breath 1.5s infinite ease-in-out;
        }
        @keyframes breath {
            0% { box-shadow: 0 10px 25px rgba(229, 62, 62, 0.2); }
            50% { box-shadow: 0 10px 35px rgba(229, 62, 62, 0.3); }
            100% { box-shadow: 0 10px 25px rgba(229, 62, 62, 0.2); }
        }
        .voice-btn:hover:not(.recording) {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 25px rgba(66, 153, 225, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(66, 153, 225, 0.1);
        }
        .voice-btn:active:not(.recording) {
            transform: translateY(-1px);
            box-shadow: 
                0 6px 15px rgba(66, 153, 225, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(66, 153, 225, 0.1);
        }
        .recording-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(229, 62, 62, 0.15);
            animation: pulse 1.5s infinite ease-in-out;
            z-index: -1;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }
        /* 发送按钮 */
        .send-btn {
            height: 70px;
            width: 70px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* 磨砂+浅色渐变 */
            background: linear-gradient(135deg, #f5fafe, #eaf6fa);
            box-shadow: 
                0 6px 16px rgba(66, 153, 225, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(66, 153, 225, 0.1);
            color: #4299e1;
        }
        .send-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 8px 20px rgba(66, 153, 225, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(66, 153, 225, 0.1);
        }
        .send-btn:active {
            transform: translateY(0);
            box-shadow: 
                0 4px 12px rgba(66, 153, 225, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(66, 153, 225, 0.1);
        }
        .loading {
            color: #4299e1;
            text-align: center;
            padding: 12px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
        }

        .loading span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4299e1, #38b2ac);
            animation: loading 1.2s infinite alternate ease-in-out;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.6s;
        }

        .loading span.loading-text {
            background: transparent;
            animation: none;
            width: auto;
            height: auto;
            font-size: 14px;
            margin-left: 10px;
        }
        .loading span:last-child {
            background: transparent;
            animation: none;
            width: auto;
            height: auto;
            font-size: 14px;
        }
        .loading-text {
            background: transparent !important;
            animation: none !important;
            width: auto !important;
            height: auto !important;
            font-size: 14px;
            margin-left: 5px;
        }
        @keyframes loading {
            from { transform: scale(0.8); opacity: 0.6; }
            to { transform: scale(1.5); opacity: 1; }
        }
        .permission-tip {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #4299e1;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #4299e1;
            box-shadow: 0 4px 20px rgba(66, 153, 225, 0.15);
            z-index: 9999;
            display: none;
        }
        .audio-play-btn {
            margin-left: 10px;
            cursor: pointer;
            color: #4299e1;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .audio-play-btn:hover {
            color: #3182ce;
            transform: scale(1.1);
        }
        .search-result-panel {
            width: 100%;
            /* 固定高度（匹配面板整体高度，减去标签栏高度） */
            height: calc(100% - 80px); 
            max-height: 620px; /* 兜底最大高度，防止溢出 */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 20px;
            padding: 10px 0;
            /* 开启垂直滚动，水平不滚动 */
            overflow-y: auto;
            overflow-x: hidden;
            /* 优化滚动条样式 */
            scrollbar-width: thin;
            scrollbar-color: rgba(66, 153, 225, 0.3) rgba(247, 250, 252, 0.5);
        }
        .search-result-title {
            color: #2d3748;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            width: 100%;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(66, 153, 225, 0.1);
        }
        .search-answer {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            border: 1px solid rgba(66, 153, 225, 0.1);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
            line-height: 1.8;
            color: #2d3748;
            font-size: 16px;
        }
        .search-references-title {
            color: #4a5568;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
        }
        .reference-item {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            width: 100%;
            border-left: 3px solid #4299e1;
        }
        .reference-title {
            color: #4299e1;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .reference-content {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }
        .reference-url {
            color: #38b2ac;
            font-size: 12px;
            margin-top: 8px;
            word-break: break-all;
        }
        /* 切换标签样式 */
        .panel-tabs {
            display: flex;
            width: 100%;
            gap: 10px;
            position: sticky;
            top: 0;
            background: rgba(247, 250, 252, 0.95);
            padding: 10px 0;
            margin-bottom: 15px;
            z-index: 100;
            border-bottom: 1px solid rgba(66, 153, 225, 0.1);
        }
        .tab-btn {
            flex: 1;
            height: 45px;
            border-radius: 12px;
            border: none;
            background: rgba(247, 250, 252, 0.8);
            color: #718096;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #4299e1, #38b2ac);
            color: white;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.2);
        }
        .music-placeholder, .music-player-container, .search-result-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .reference-url a {
            color: #38b2ac;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .reference-url a:hover {
            color: #4299e1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="permission-tip" id="permission-tip">正在请求麦克风权限，请允许...</div>
    <div class="container">
        <div class="header">
            <h1>小南</h1>
            <p>🎵 我是您专属的音乐搭子。</p>
        </div>
        <div class="main-layout">
            <!-- 左侧虚拟角色视频面板 -->
            <div class="avatar-panel">
                <div class="avatar-video-container">
                    <video id="normal-video" class="avatar-video" loop muted autoplay playsinline>
                        <source src="xiaonan/xiaonannormal.mp4" type="video/mp4">
                    </video>
                    <video id="talking-video" class="avatar-video" loop muted playsinline style="display: none;">
                        <source src="xiaonan/xiaonantalking.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
            
            <!-- 中间聊天面板 -->
            <div class="chat-panel">
                <!-- 原有聊天面板内容不变 -->
                <div class="chat-box" id="chat-box">
                    <div class="message ai-message">
                        <div class="message-content">
                            你好呀～🎶 我可以为您推荐歌曲、调节音效、解答歌曲相关问题，有任何需求都可以告诉我哦！
                            <span class="audio-play-btn" onclick="playTTS('你好呀～🎶 我可以为您推荐歌曲、调节音效、解答歌曲相关问题，有任何需求都可以告诉我哦！')">🔊</span>
                        </div>
                    </div>
                </div>
                <div class="loading" id="loading">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span class="loading-text">智能助手正在响应...</span>
                </div>
                <div class="input-wrapper">
                    <div class="voice-btn-container">
                        <button class="voice-btn" id="voice-btn">
                            <div class="recording-indicator" id="recording-indicator" style="display: none;"></div>
                            🎙️
                        </button>
                    </div>
                    <div class="input-area">
                        <textarea id="user-input" placeholder="输入您想聊的内容..."></textarea>
                        <button class="send-btn" id="send-btn">➤</button>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="music-panel" id="music-panel">
                <div class="panel-tabs">
                    <button class="tab-btn active" id="music-tab" onclick="switchPanel('music')">🎵 歌曲播放</button>
                    <button class="tab-btn" id="search-tab" onclick="switchPanel('search')">🔍 智能搜索</button>
                </div>
                <div class="music-placeholder" id="music-placeholder">
                    🎶 暂无播放歌曲<br/>
                    说“播放一首特别的人”试试～
                </div>
                <div class="music-player-container" id="music-player-container" style="display: none;">
                    <h3 class="song-title" id="song-title"></h3>
                    <audio id="audio-player" controls class="audio-player"></audio>
                    <div class="lyric-container" id="lyric-container">
                        <div class="lyric-scroll" id="lyric-scroll"></div>
                    </div>
                </div>
                <div class="search-result-panel" id="search-result-panel" style="display: none;">
                    <div class="search-result-title" id="search-result-title">智能搜索结果</div>
                    <div class="search-answer" id="search-answer">
                        暂无搜索结果，输入歌曲相关问题试试～
                    </div>
                    <div class="search-references-title">参考来源</div>
                    <div id="search-references">
                        <div class="reference-item">
                            <div class="reference-title">等待搜索...</div>
                            <div class="reference-content">请输入问题触发智能搜索</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CHAT_API_URL = "http://127.0.0.1:8000/api/chat";
        const ASR_API_URL = "http://127.0.0.1:8000/api/asr";
        const TTS_API_URL = "http://127.0.0.1:8000/api/tts";
        
        let mediaStream = null;       
        let mediaRecorder = null;     
        let audioChunks = [];         
        let isRecording = false;      
        let isPermissionGranted = false;
        let audioContext = null;

        // 歌曲播放相关全局变量
        let audioPlayer = null;
        let currentLyrics = [];
        let lyricScrollEl = null;
        let lyricContainerEl = null;
        let lastActiveIndex = -1;

        // 虚拟角色视频相关变量
        let normalVideo = null;
        let talkingVideo = null;
        let ttsAudio = null;
        let isTalking = false;

        let currentPanel = 'music'; 
        let lastSearchResult = null;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async () => {
            const permissionTip = document.getElementById('permission-tip');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const voiceBtn = document.getElementById('voice-btn');
            
            permissionTip.style.display = 'block';
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });

                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        sampleSize: 16,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });

                isPermissionGranted = true;
                console.log("✅ 麦克风权限已获取，AudioContext初始化完成");
                permissionTip.style.display = 'none';

            } catch (err) {
                console.error("❌ 初始化失败:", err);
                permissionTip.textContent = `初始化失败：${err.message}，请刷新页面`;
                permissionTip.style.color = '#e53e3e';
                setTimeout(() => {
                    permissionTip.style.display = 'none';
                }, 5000);
            }

            initAvatarVideos();
            initMusicPlayer();

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            sendBtn.addEventListener('click', sendMessage);
            voiceBtn.addEventListener('click', toggleRecording);
        });

        function switchPanel(panelType) {
            currentPanel = panelType;
            const musicTab = document.getElementById('music-tab');
            const searchTab = document.getElementById('search-tab');
            const musicPlaceholder = document.getElementById('music-placeholder');
            const musicPlayerContainer = document.getElementById('music-player-container');
            const searchResultPanel = document.getElementById('search-result-panel');

            // 切换标签激活状态
            if (panelType === 'music') {
                musicTab.classList.add('active');
                searchTab.classList.remove('active');
                searchResultPanel.style.display = 'none';
                if (audioPlayer.src) {
                    musicPlayerContainer.style.display = 'flex';
                    musicPlaceholder.style.display = 'none';
                } else {
                    musicPlaceholder.style.display = 'block';
                    musicPlayerContainer.style.display = 'none';
                }
            } else if (panelType === 'search') {
                musicTab.classList.remove('active');
                searchTab.classList.add('active');
                musicPlaceholder.style.display = 'none';
                musicPlayerContainer.style.display = 'none';
                searchResultPanel.style.display = 'flex';
                if (lastSearchResult) {
                    renderSearchResult(lastSearchResult);
                } else {
                    document.getElementById('search-answer').textContent = '暂无搜索结果，输入歌曲相关问题试试～';
                    document.getElementById('search-references').innerHTML = `
                        <div class="reference-item">
                            <div class="reference-title">等待搜索...</div>
                            <div class="reference-content">请输入问题触发智能搜索</div>
                        </div>
                    `;
                }
            }
        }
        // ========== 搜索结果渲染函数 ==========
        function renderSearchResult(searchResult) {
            const searchAnswer = document.getElementById('search-answer');
            const searchReferences = document.getElementById('search-references');
            const searchResultTitle = document.getElementById('search-result-title');

            searchResultTitle.textContent = '智能搜索结果';
            
            let cleanAnswer = searchResult.ai_answer || '暂无有效搜索结果';
            cleanAnswer = cleanAnswer.replace(/\*\*/g, '') 
                                    .replace(/\n+/g, ' ')
                                    .replace(/\^\[\d+\]\^/g, '')
                                    .trim();
            
            searchAnswer.textContent = cleanAnswer;

            searchReferences.innerHTML = '';
            if (searchResult.references && searchResult.references.length > 0) {
                searchResult.references.forEach((ref, index) => {
                    if (!ref.content || ref.content === 'None') return;
                    
                    const refItem = document.createElement('div');
                    refItem.className = 'reference-item';
                    const cleanContent = ref.content.replace(/\n+/g, ' ').substring(0, 100);
                    // ========== URL转为超链接 ==========
                    const refUrl = ref.url || '无链接';
                    let urlHtml = refUrl === '无链接' 
                        ? refUrl 
                        : `<a href="${refUrl}" target="_blank" style="color: #38b2ac; text-decoration: none;">${refUrl}</a>`;
                    
                    refItem.innerHTML = `
                        <div class="reference-title">${index + 1}. ${ref.title || '无标题'}</div>
                        <div class="reference-content">${cleanContent || '无内容'}</div>
                        <div class="reference-url">${urlHtml}</div>
                    `;
                    searchReferences.appendChild(refItem);
                });
                
                if (searchReferences.children.length === 0) {
                    const noRefItem = document.createElement('div');
                    noRefItem.className = 'reference-item';
                    noRefItem.innerHTML = `
                        <div class="reference-title">暂无有效参考来源</div>
                        <div class="reference-content">未获取到相关参考信息</div>
                    `;
                    searchReferences.appendChild(noRefItem);
                }
            } else {
                const noRefItem = document.createElement('div');
                noRefItem.className = 'reference-item';
                noRefItem.innerHTML = `
                    <div class="reference-title">暂无参考来源</div>
                    <div class="reference-content">未获取到相关参考信息</div>
                `;
                searchReferences.appendChild(noRefItem);
            }
        }
        // ========== 虚拟角色视频相关函数 ==========
        function initAvatarVideos() {
            normalVideo = document.getElementById('normal-video');
            talkingVideo = document.getElementById('talking-video');
            normalVideo.onloadeddata = function() {
                this.play();
            };
            
            talkingVideo.onloadeddata = function() {
                this.play();
            };
            
            // 视频加载失败处理
            normalVideo.onerror = function() {
                console.error("正常状态视频加载失败:", this.src);
            };
            
            talkingVideo.onerror = function() {
                console.error("说话状态视频加载失败:", this.src);
            };
        }

        // 切换到说话状态
        function switchToTalkingMode() {
            if (isTalking) return;
            
            isTalking = true;
            // 强制视频立即播放（跳过预加载延迟）
            normalVideo.style.display = 'none';
            talkingVideo.style.display = 'block';
            talkingVideo.currentTime = 0; // 重置视频到开头
            talkingVideo.play().catch(err => {
                console.warn("视频播放触发失败（浏览器策略）:", err);
                talkingVideo.style.display = 'block';
            });
        }

        // 切换到正常状态
        function switchToNormalMode() {
            if (!isTalking) return;
            
            isTalking = false;
            talkingVideo.style.display = 'none';
            normalVideo.style.display = 'block';
            normalVideo.play();
        }

        // ========== 歌曲播放相关函数 ==========
        function initMusicPlayer() {
            audioPlayer = document.getElementById('audio-player');
            lyricScrollEl = document.getElementById('lyric-scroll');
            lyricContainerEl = document.getElementById('lyric-container');
            
            // 监听音频播放结束事件
            audioPlayer.onended = () => {
                clearMusicPanel();
            };
            
            let lyricUpdateTimer = null;
            audioPlayer.onplay = () => {
                // 启动定时更新
                lyricUpdateTimer = setInterval(() => {
                    if (!audioPlayer.paused && !audioPlayer.ended) {
                        syncLyrics();
                    }
                }, 200);
            };
            
            audioPlayer.onpause = () => {
                clearInterval(lyricUpdateTimer);
            };
            
            audioPlayer.onended = () => {
                clearInterval(lyricUpdateTimer);
                clearMusicPanel();
            };
        }

        function getCurrentLyricIndex() {
            if (!currentLyrics.length) return -1;
            
            const currentTime = audioPlayer.currentTime;
            for (let i = 0; i < currentLyrics.length; i++) {
                const lyricTime = parseFloat(currentLyrics[i].time);
                const nextLyricTime = i + 1 < currentLyrics.length ? 
                    parseFloat(currentLyrics[i+1].time) : Infinity;
                
                if (currentTime >= lyricTime && currentTime < nextLyricTime) {
                    return i;
                }
            }
            
            return -1;
        }

        function clearMusicPanel() {
            const musicPanel = document.getElementById('music-panel');
            const playerContainer = document.getElementById('music-player-container');
            const placeholder = document.querySelector('.music-placeholder');
            
            // 重置状态
            audioPlayer.pause();
            audioPlayer.src = "";
            currentLyrics = [];
            lyricScrollEl.innerHTML = "";
            lastActiveIndex = -1;
            
            // 显示占位符，隐藏播放器
            playerContainer.style.display = "none";
            placeholder.style.display = "block";
            
            // 提示播放结束
            const chatBox = document.getElementById('chat-box');
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', {hour12: false});
            chatBox.innerHTML += `
                <div class="message ai-message">
                    <div class="message-content">🎵 《${document.getElementById('song-title').textContent}》播放结束啦～</div>
                    <div class="message-time">${timeStr}</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function loadAndPlaySong(songName) {
            try {
                //模糊匹配歌曲名
                const matchRes = await fetch(`http://127.0.0.1:8000/api/music/match/${encodeURIComponent(songName)}`);
                const matchData = await matchRes.json();
                
                if (matchData.code !== 200) {
                    alert(`未找到《${songName}》相关歌曲`);
                    return;
                }
                
                const songInfo = matchData.data;
                const realSongName = songInfo.name;
                
                //更新播放面板
                const musicPanel = document.getElementById('music-panel');
                const playerContainer = document.getElementById('music-player-container');
                const placeholder = document.querySelector('.music-placeholder');
                const songTitle = document.getElementById('song-title');
                
                //隐藏占位符
                placeholder.style.display = "none";
                playerContainer.style.display = "flex";
                songTitle.textContent = realSongName;
                
                //加载音频
                const audioUrl = `http://127.0.0.1:8000/api/music/play/${encodeURIComponent(realSongName)}`;
                audioPlayer.src = audioUrl;
                
                //加载并解析歌词
                if (songInfo.has_lyric) {
                    const lyricRes = await fetch(`http://127.0.0.1:8000/api/music/lyric/${encodeURIComponent(realSongName)}`);
                    const lyricData = await lyricRes.json();
                    if (lyricData.code === 200) {
                        currentLyrics = lyricData.data;
                        renderLyrics();
                        lastActiveIndex = -1;
                    }
                }
                
                // 自动播放
                try {
                    await audioPlayer.play();
                } catch (playErr) {
                    console.warn("自动播放失败（浏览器限制），请手动点击播放:", playErr);
                    const chatBox = document.getElementById('chat-box');
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('zh-CN', {hour12: false});
                    chatBox.innerHTML += `
                        <div class="message ai-message">
                            <div class="message-content">🎵 已为你准备好《${realSongName}》，请点击播放按钮开始播放～</div>
                            <div class="message-time">${timeStr}</div>
                        </div>
                    `;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
                
                // 在聊天框提示
                const chatBox = document.getElementById('chat-box');
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', {hour12: false});
                chatBox.innerHTML += `
                    <div class="message ai-message">
                        <div class="message-content">🎵 正在为你播放《${realSongName}》～</div>
                        <div class="message-time">${timeStr}</div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                console.error("播放歌曲失败：", error);
                alert(`播放歌曲失败：${error.message}`);
            }
        }

        function renderLyrics() {
            lyricScrollEl.innerHTML = "";
            lastActiveIndex = -1;
            
            currentLyrics.forEach((lyric, index) => {
                const lyricLine = document.createElement('div');
                lyricLine.className = "lyric-line";
                lyricLine.dataset.time = lyric.time;
                lyricLine.dataset.index = index;
                lyricLine.textContent = lyric.text;
                lyricScrollEl.appendChild(lyricLine);
            });
            
            if (currentLyrics.length > 0) {
                updateLyricHighlight(0);
            }
        }

        // 歌词同步逻辑 - 只显示三行
        function syncLyrics() {
            if (!currentLyrics.length || !lyricScrollEl || !lyricContainerEl) return;
            
            const activeIndex = getCurrentLyricIndex();
            
            if (activeIndex === -1 || activeIndex === lastActiveIndex) return;
            
            updateLyricHighlight(activeIndex);
            lastActiveIndex = activeIndex;
        }

        function updateLyricHighlight(activeIndex) {
            document.querySelectorAll('.lyric-line').forEach(el => {
                el.classList.remove('active', 'prev', 'next');
                el.style.opacity = 0;
            });
            
            // 显示当前行
            const activeLine = document.querySelector(`.lyric-line[data-index="${activeIndex}"]`);
            if (activeLine) {
                activeLine.classList.add('active');
                activeLine.style.opacity = 1;
            }
            
            // 显示上一行
            if (activeIndex > 0) {
                const prevLine = document.querySelector(`.lyric-line[data-index="${activeIndex - 1}"]`);
                if (prevLine) {
                    prevLine.classList.add('prev');
                    prevLine.style.opacity = 0.5;
                }
            }
            
            // 显示下一行
            if (activeIndex < currentLyrics.length - 1) {
                const nextLine = document.querySelector(`.lyric-line[data-index="${activeIndex + 1}"]`);
                if (nextLine) {
                    nextLine.classList.add('next');
                    nextLine.style.opacity = 0.5;
                }
            }
        }

        // ========== 录音相关函数 ==========
        function convertWebMToPCM(webmBlob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const audioBuffer = await audioContext.decodeAudioData(e.target.result);
                        const monoBuffer = audioContext.createBuffer(
                            1, 
                            audioBuffer.length, 
                            audioBuffer.sampleRate
                        );
                        
                        // 合并声道
                        const channelData = audioBuffer.getChannelData(0);
                        monoBuffer.copyToChannel(channelData, 0);
                        
                        // 转换为16位PCM
                        const data = monoBuffer.getChannelData(0);
                        const float32Array = new Float32Array(data);
                        const int16Array = new Int16Array(float32Array.length);
                        
                        for (let i = 0; i < float32Array.length; i++) {
                            const s = Math.max(-1, Math.min(1, float32Array[i]));
                            int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        
                        resolve(int16Array.buffer);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(webmBlob);
            });
        }

        async function toggleRecording() {
            if (!isPermissionGranted) {
                alert("麦克风权限未授权，无法录音！");
                return;
            }

            const voiceBtn = document.getElementById('voice-btn');
            const recordingIndicator = document.getElementById('recording-indicator');

            if (!isRecording) {
                // 开始录音
                isRecording = true;
                voiceBtn.classList.add('recording');
                recordingIndicator.style.display = 'block';
                
                audioChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm; codecs=opus' });
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.start(100); 
                console.log("🎤 开始录音...");

            } else {
                // 结束录音
                isRecording = false;
                voiceBtn.classList.remove('recording');
                recordingIndicator.style.display = 'none';
                
                if (mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    console.log("🛑 停止录音，等待处理...");
                    
                    mediaRecorder.onstop = async () => {
                        try {
                            const webmBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const pcmBuffer = await convertWebMToPCM(webmBlob);
                            await sendAudioToASR(pcmBuffer);
                        } catch (err) {
                            console.error("❌ 录音处理失败:", err);
                            alert(`录音处理失败: ${err.message}`);
                        }
                    };
                }
            }
        }

        async function sendAudioToASR(pcmBuffer) {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            try {
                const blob = new Blob([pcmBuffer], { type: 'application/octet-stream' });
                const formData = new FormData();
                formData.append('audio_file', blob, 'recording.pcm');

                const response = await fetch(ASR_API_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'cors'
                });

                const result = await response.json();
                loading.style.display = 'none';

                if (result.code === 200) {
                    const asrText = result.data.asr_text;
                    const aiReply = result.data.ai_reply;
                    const playSong = result.data.play_song;
                    const searchResult = result.data.search_result || {}; 
                    
                    addMessageToChat('user', asrText);
                    addMessageToChat('ai', aiReply);
                    
                    if (result.data.tts_text) {
                        await playTTS(result.data.tts_text);
                    }

                    if (playSong) {
                        await loadAndPlaySong(playSong);
                        switchPanel('music');
                    }

                    if (searchResult && searchResult.status === 'success' && searchResult.ai_answer) {
                        lastSearchResult = {
                            ai_answer: searchResult.ai_answer,
                            references: searchResult.references || []
                        };
                        switchPanel('search');
                        renderSearchResult(lastSearchResult); // 强制渲染
                    }
                    
                } else {
                    alert(`语音识别失败: ${result.msg}`);
                    addMessageToChat('ai', `抱歉，${result.msg}😥`);
                }
            } catch (err) {
                loading.style.display = 'none';
                console.error("❌ ASR请求失败:", err);
                alert(`语音识别请求失败: ${err.message}`);
                addMessageToChat('ai', `抱歉，语音识别请求失败了😥`);
            }
        }

        // ========== 聊天相关函数 ==========
        async function sendMessage() {
            const userInputEl = document.getElementById('user-input');
            if (!userInputEl) {
                console.error("用户输入框未找到");
                return;
            }
            
            const userInput = userInputEl.value.trim();
            if (!userInput) {
                console.log("空输入，忽略发送请求");
                return;
            }

            addMessageToChat('user', userInput);
            userInputEl.value = '';

            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            try {
                const response = await fetch(CHAT_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ user_input: userInput }),
                    mode: 'cors'
                });

                if (!response.ok) {
                    throw new Error(`HTTP错误！状态码：${response.status}`);
                }

                const result = await response.json();
                loading.style.display = 'none';

                if (result.code === 200) {
                    const aiReply = result.data.reply;
                    const playSong = result.data.play_song;
                    const searchResult = result.data.search_result || {};
                    
                    addMessageToChat('ai', aiReply);
                    
                    if (result.data.tts_text) {
                        await playTTS(result.data.tts_text);
                    }

                    // 处理歌曲播放
                    if (playSong) {
                        await loadAndPlaySong(playSong);
                        switchPanel('music');
                    }

                    if (searchResult && searchResult.status === 'success' && searchResult.ai_answer) {
                        lastSearchResult = {
                            ai_answer: searchResult.ai_answer,
                            references: searchResult.references || []
                        };
                        switchPanel('search');
                        renderSearchResult(lastSearchResult); // 强制渲染
                    }
                    
                } else {
                    addMessageToChat('ai', `抱歉，${result.msg}😥`);
                }
            } catch (err) {
                loading.style.display = 'none';
                console.error("❌ 聊天请求失败:", err);
                addMessageToChat('ai', `抱歉，请求失败了😥 错误信息：${err.message}`);
            }
        }

        function addMessageToChat(role, content) {
            const chatBox = document.getElementById('chat-box');
            if (!chatBox) {
                console.error("聊天框未找到");
                return;
            }
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', {hour12: false});
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // 处理换行符
            const formattedContent = content.replace(/～/g, '<br/>');
            contentDiv.innerHTML = `${formattedContent}${role === 'ai' ? ` <span class="audio-play-btn" onclick="playTTS('${content.replace(/'/g, "\\'")}')">🔊</span>` : ''}`;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = timeStr;
            
            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);
            chatBox.appendChild(messageDiv);
            
            // 滚动到最底部
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function playTTS(text) {
            try {
                // 停止之前的TTS播放
                if (ttsAudio) {
                    ttsAudio.pause();
                    ttsAudio = null;
                }
                
                // 切换到说话状态
                switchToTalkingMode();
                
                const encodedText = encodeURIComponent(text);
                ttsAudio = new Audio(`${TTS_API_URL}?text=${encodedText}`);
                
                // 监听音频播放结束，切换回正常状态
                ttsAudio.onended = function() {
                    switchToNormalMode();
                    ttsAudio = null;
                };
                
                // 监听音频播放出错，切换回正常状态
                ttsAudio.onerror = function() {
                    switchToNormalMode();
                    ttsAudio = null;
                    console.error("TTS音频播放出错");
                };
                
                await ttsAudio.play();
                
            } catch (err) {
                switchToNormalMode();
                console.error("❌ TTS播放失败:", err);
                alert(`语音播放失败: ${err.message}`);
            }
        }
    </script>
